name: trame
description: The client of trame, the Go hub of collaborative editors - operational transforms on trees of nodes and flows of text, and the session that keeps a document in step with the hub, offline edits included.
version: 0.4.0
repository: https://github.com/citadellefr/trame
issue_tracker: https://github.com/citadellefr/trame/issues
topics: [collaboration, ot, editor, websocket]

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
